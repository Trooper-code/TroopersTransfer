name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to a release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            artifact: TroopersTransfer.exe
          - os: ubuntu-latest
            name: linux-amd64
            artifact: TroopersTransfer
          - os: macos-latest
            name: macos-arm64
            artifact: TroopersTransfer
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Test
        shell: bash
        run: |
          go vet ./...
          go test ./...

      # The Windows runner ships MinGW-w64 gcc on PATH, which Fyne's cgo needs.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # go-winres wants a plain numeric version
          $v = ($env:VERSION -split '-')[0]
          ./build.ps1 -Version $v

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TroopersTransfer-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            f="TroopersTransfer-${{ matrix.name }}.zip"
            7z a "../$f" TroopersTransfer.exe
          else
            f="TroopersTransfer-${{ matrix.name }}.tar.gz"
            tar czf "../$f" TroopersTransfer
          fi
          # Checksum file the in-app updater verifies downloads against.
          cd .. && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") > "$f.sha256"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: TroopersTransfer-${{ matrix.name }}.*
